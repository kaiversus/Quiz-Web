    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body>

            <h2 style="color: var(--accent-color); margin-top: 0;">Nạp dữ liệu ôn tập</h2>

        <div class="modal-content">
                <h2>Ôn tập Trắc nghiệm 🤖</h2>
                <p>Tải lên file tài liệu (PDF, Word, Text), AI sẽ tự tạo đề thi cho bạn.</p>

                <div style="margin-bottom: 20px; text-align: left;">
                    <label style="font-weight:bold; display:block; margin-bottom:5px;"> Chọn file tài liệu</label>
                    <input type="file" id="file-upload" accept=".txt,.json,.pdf,.docx" 
                        style="width: 100%; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; color: white;">
                </div>

                <div class="quiz-settings">
                    <label class="setting-option"><input type="checkbox" id="shuffle-questions" checked> Xáo trộn câu hỏi</label>
                    <label class="setting-option"><input type="checkbox" id="shuffle-options" checked> Xáo trộn đáp án</label>
                </div>

                <button id="process-btn">🚀 TẠO ĐỀ THI & BẮT ĐẦU</button>
                <p id="loading-text" style="display:none; color: #00d2ff; margin-top:10px;">Đang đọc file và nhờ AI soạn câu hỏi... (Vui lòng chờ)</p>
        </div>
    </div>
    

    <div class="main-container hidden" id="main-ui">
        
        <div class="question-area">
            <div class="header-bar">
                <h3>Lượt <span id="round-number">1</span> · Câu hỏi <span id="q-number">1</span>/<span id="round-total">0</span></h3>
            </div>
            
            <div id="question-content">
                </div>

            <div class="navigation-buttons">
                <button id="prev-btn" onclick="changeQuestion(-1)">Câu trước</button>
                <button id="next-btn" onclick="changeQuestion(1)">Câu sau</button>
                <button id="finish-round-btn" class="primary-action" type="button">Làm xong</button>
            </div>
        </div>

        <div class="sidebar">
            <h3>Danh sách câu · Lượt <span id="sidebar-round">1</span></h3>
            <div id="question-list" class="grid-list">
                </div>
            <div class="summary">
                <p>Đúng: <span id="score-correct" style="color:green">0</span> | Sai: <span id="score-wrong" style="color:red">0</span></p>
                <button id="show-result-btn" class="nav-btn primary-action hidden" type="button">Xem kết quả lượt</button>
            </div>
        </div>
    </div>

    <div id="result-modal" class="modal hidden">
    <div class="modal-content">
        <h2 id="result-title">Kết quả lượt</h2>
        <p id="result-message"></p>
        
        <div class="result-stats">
            <div class="stat-item">
                <span id="final-correct" class="stat-value">0/0</span>
                <span class="stat-label">Câu Đúng ✅</span>
            </div>
            <div class="stat-item">
                <span id="final-wrong" class="stat-value">0</span>
                <span class="stat-label">Câu Sai ❌</span>
            </div>
            <div class="stat-item">
                <span id="final-unanswered" class="stat-value">0</span>
                <span class="stat-label">Chưa làm</span>
            </div>
        </div>

        <button id="next-round-btn" class="nav-btn primary-action" type="button">Làm lại câu sai và chưa làm</button>
        <button id="review-btn" class="nav-btn secondary-action" type="button">Xem lại lượt này</button>
        <button id="restart-btn" class="nav-btn secondary-action hidden" type="button">Làm lại từ đầu</button>
    </div>
</div>
<script src="script.js"></script>
</body>

</html>
